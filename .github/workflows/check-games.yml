name: Check games

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-games.mjs

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the scan can see which files the PR changed
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scan-games.mjs "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
